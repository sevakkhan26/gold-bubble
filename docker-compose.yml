services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gold
      POSTGRES_PASSWORD: goldpass
      POSTGRES_DB: goldmarket
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gold -d goldmarket"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://gold:goldpass@db:5432/goldmarket
      NAVASAN_API_KEY: ${NAVASAN_API_KEY:-}
      BRSAPI_KEY: ${BRSAPI_KEY:-}
      REFRESH_SEC: ${REFRESH_SEC:-60}
      PORT: 8787
    ports:
      - "8787:8787"

volumes:
  pgdata:
