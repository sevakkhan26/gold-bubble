      shemsh24: hasOwnG24 ? e.shemsh24PerKg : null,

    if (!home.aed && market.aed) {

// no backend running.
function parseNavasanToEntry(data) {
  const v = keys => {
    for (const k of keys) {
      const o = data && data[k];
      const n = o && o.value != null ? Number(o.value) : null;
      if (n != null && !isNaN(n) && n > 0) return n;
    }
    return null;
  };
  const usdBuy = v(["harat_naghdi_buy"]);
  const usdSell = v(["harat_naghdi_sell", "harat_naghdi", "usd_sell", "usd"]);
  const aed = v(["aed", "derham_dubai", "aed_sell"]);
  const g18 = v(["18ayar", "gold_18", "tala_18ayar"]);
  let g24 = v(["24ayar", "gold_24", "abshodeh"]);
  if (g24 == null && g18 != null) g24 = g18 / 0.75;
  const usd = usdBuy != null || usdSell != null ? {
    buy: Math.round(usdBuy ?? usdSell),
    sell: Math.round(usdSell ?? usdBuy)
  } : null;
  const gold18 = g18 != null ? {
    buy: Math.round(g18 * 1000),
    sell: Math.round(g18 * 1000)
  } : null;
  const entry = {
    usd,
    aed: aed != null ? {
      buy: Math.round(aed),
      sell: Math.round(aed)
    } : null,
    gold18,
    shemsh24: g24 != null ? {
      buy: Math.round(g24 * 1000),
      sell: Math.round(g24 * 1000)
    } : null,
    goldGlobal: gold18
  };
  const has = Object.keys(entry).some(k => entry[k]);
  return has ? entry : null;

    const usdtBuy = Math.round(usdtSell * (1 - spreadPct) / 100) * 100;
    const aedSell = Math.round(usdSell / 3.6725 / 10) * 10;
    const aedBuy = Math.round(usdBuy / 3.6725 / 10) * 10;
    // Gold 18k per-KILOGRAM (Toman) — mock ballpark (~98× dollar per gram × 1000).
    const gold18SellG = Math.round((usdSell * 98 + offset * 40) / 1000) * 1000; // per gram
    const gold18Sell = gold18SellG * 1000; // per kilogram
    const gold18Buy = Math.round(gold18Sell * (1 - spreadPct));
    // "تبدیل طلای جهانی" is computed live from the ounce price × this dollar,
    // so these mock fields are just fallbacks and normally unused.
    const goldGlobalSell = gold18Sell;
    const goldGlobalBuy = gold18Buy;
    // Shemsh (24k ingot) per-KILOGRAM (Toman) — 18k/0.75 with a small ingot premium.
    const shemsh24Sell = Math.round(gold18SellG / 0.75 * 1.005) * 1000; // per kilogram
    const shemsh24Buy = Math.round(shemsh24Sell * (1 - spreadPct));
    out[ex.id] = {
      usd: {
        buy: usdBuy,
        sell: usdSell
      },
      usdt: {
        buy: usdtBuy,
        sell: usdtSell
      },
      aed: {
        buy: aedBuy,
        sell: aedSell
      },
      gold18: {
        buy: gold18Buy,
        sell: gold18Sell
      },
      goldGlobal: {
        buy: goldGlobalBuy,
        sell: goldGlobalSell
      },
      shemsh24: {
        buy: shemsh24Buy,
        sell: shemsh24Sell
      }
    };
  });
  return out;
}

// Fetch JSON, retrying through a public CORS proxy if the direct request is
// blocked (many Iranian exchange APIs don't send CORS headers, so a direct
// browser fetch from this sandbox fails with "Failed to fetch").
async function fetchJsonWithProxy(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch {
    const proxied = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
    if (!proxied.ok) throw new Error(`proxy HTTP ${proxied.status}`);
    return await proxied.json();
  }
}

function normalizePath(pathname) {
  if (!pathname) return "/";
  var p = pathname.split("?")[0].split("#")[0];
  if (p.length > 1 && p.endsWith("/")) p = p.slice(0, -1);
  return p || "/";
}
function pageFromLocation() {
  var p = normalizePath(window.location.pathname);
  if (PATH_TO_PAGE[p]) return PATH_TO_PAGE[p];
  // allow /index.html → market
  if (p === "/index.html") return "market";
  return "market";
}
function pathForPage(pageId) {
  return PAGE_ROUTES[pageId] || "/market";
}
